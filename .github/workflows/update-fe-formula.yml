name: Update Fe Homebrew formulae

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Fetch stable and maintenance release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/flushwhy/fe/releases?per_page=100" > releases.json

      - name: Update formulae from release assets
        run: ruby scripts/update-fe-formula.rb releases.json

      - name: Create pull request if formulae changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/update-fe-formula
          delete-branch: true
          commit-message: "Update Fe Homebrew formulae"
          title: "Update Fe Homebrew formulae"
          body: |
            Automated update of Fe's stable and versioned Homebrew formulae.

            The main formula tracks the newest stable release. Versioned formulae
            track the newest patch release in their respective maintenance lines.
            Asset URLs and SHA-256 digests are read from GitHub release metadata.
            Please review before merging.
